<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2746%27 fill=%27%23FE5000%27/%3E%3C/svg%3E"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>SMTH · План проекта</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Токены — брендбук SMTH: SMTH Orange #FE5000, SMTH Ink #101820, Bone #F6F4EF, Sand, Stone, Mist, Graphite #5A5E63 */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#F3F1EB; --ink:#101820; --ink-2:#3A4048; --muted:#5A5E63;
  --line:#E6E3DC; --line-2:#CFC3B2; --accent:#FE5000; --accent-hover:#E04600; --accent-ink:#FFFFFF; --accent-soft:#FFE8DC; --focus:#FE5000;
  --good:#2BB673; --warn:#EDA100; --crit:#C0392B; --good-soft:#DFF4E8; --warn-soft:#FDF1D6; --crit-soft:#F8DEDE; --plan-soft:#E6E7E9;
  --s1:#FE5000; --s2:#101820; --s3:#2A78D6; --s4:#2BB673; --s5:#EDA100; --s6:#7C5CBF; --s7:#1B9E9E; --s8:#D9537A;
  --shadow:0 4px 24px rgba(16,24,32,.08); --today:#FE5000; --weekend:rgba(16,24,32,.035);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101820; --surface:#18212B; --surface-2:#1F2A35; --ink:#F6F4EF; --ink-2:#C7CCD2; --muted:#9AA0A8;
    --line:#2B3640; --line-2:#3A4652; --accent:#FE5000; --accent-hover:#FF6A24; --accent-ink:#FFFFFF; --accent-soft:#3D2416; --focus:#FE5000;
    --good-soft:#163A2A; --warn-soft:#3F3316; --crit-soft:#3F1F1F; --plan-soft:#2A3540;
    --s2:#C7CCD2; --s3:#4A90E2; --s4:#3CC985; --s5:#F0B429; --s6:#9B82D6; --s7:#2FB8B8; --s8:#E8759A;
    --shadow:0 12px 40px rgba(0,0,0,.5); --weekend:rgba(255,255,255,.035);
  }
}
:root[data-theme="dark"]{
  --bg:#101820; --surface:#18212B; --surface-2:#1F2A35; --ink:#F6F4EF; --ink-2:#C7CCD2; --muted:#9AA0A8;
  --line:#2B3640; --line-2:#3A4652; --accent:#FE5000; --accent-hover:#FF6A24; --accent-ink:#FFFFFF; --accent-soft:#3D2416; --focus:#FE5000;
  --good-soft:#163A2A; --warn-soft:#3F3316; --crit-soft:#3F1F1F; --plan-soft:#2A3540;
  --s2:#C7CCD2; --s3:#4A90E2; --s4:#3CC985; --s5:#F0B429; --s6:#9B82D6; --s7:#2FB8B8; --s8:#E8759A;
  --shadow:0 12px 40px rgba(0,0,0,.5); --weekend:rgba(255,255,255,.035);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Inter","Golos Text",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.logo{font:800 24px/1 "Montserrat",Arial,sans-serif;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;text-transform:lowercase}
.logo i{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--accent);margin-left:.06em;vertical-align:baseline}
.logo.big{font-size:40px}
.brand h1{margin:0;font:700 15px/1.2 "Montserrat",Arial,sans-serif;letter-spacing:.01em;white-space:nowrap;color:var(--ink-2)}
.brand .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button[aria-selected="true"]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.spacer{flex:1}
.filters{display:flex;gap:8px;align-items:center;padding:0 20px 10px;flex-wrap:wrap}
.filters input[type=search],.filters select{height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 10px;min-width:0}
.filters input[type=search]{width:220px;max-width:100%}
.btn{height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.btn.primary:hover::before{background:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.sync.local i{background:var(--warn)}

main{padding:18px 20px 40px;max-width:1600px;margin:0 auto}
@media (max-width:640px){ .top-row,.filters{padding-left:16px;padding-right:16px} main{padding:14px 16px 40px} .brand h1{font-size:19px} }

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font:800 30px/1.15 "Montserrat",Arial,sans-serif;letter-spacing:-.01em;margin-top:4px}
.kpi .h{font-size:12px;color:var(--ink-2);margin-top:2px}
.kpi.crit .v{color:var(--crit)} .kpi.good .v{color:var(--good)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.panel h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.gcards{display:grid;gap:10px}
.gcard{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 10px;cursor:pointer;background:var(--surface)}
.gcard:hover{background:var(--surface-2)}
.gcard .stripe{border-radius:4px}
.gcard .name{font:700 15px/1.3 "Montserrat",Arial,sans-serif}
.gcard .meta{color:var(--ink-2);font-size:12px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.gcard .pct{font:800 22px/1.2 "Montserrat",Arial,sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.gcard .pct small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.bar{height:6px;background:var(--plan-soft);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--plan-soft);color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.chip.done{background:var(--good-soft);color:#1E7F50}.chip.active{background:var(--accent-soft);color:var(--accent)}
.chip.overdue{background:var(--crit-soft);color:var(--crit)}.chip.planned{background:var(--plan-soft);color:var(--ink-2)}
:root[data-theme="dark"] .chip.done{color:#7fd67f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.done{color:#7fd67f}}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:none}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:12px}
.owners{display:grid;gap:8px}
.owner{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.owner .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner .track{height:14px;background:var(--plan-soft);border-radius:4px;overflow:hidden;display:flex;gap:2px}
.owner .track i{display:block;height:100%}
.owner .c{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.dl{display:grid;gap:6px}
.dl-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.dl-row:hover{background:var(--surface-2)}
.dl-row .d{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;min-width:52px}
.dl-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-row .o{color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.stack{display:grid;gap:14px}

/* ---------- gantt ---------- */
.gtoolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 230px);position:relative}
.gtable{display:grid;grid-template-columns:var(--left,380px) 1fr;min-width:max-content}
.ghead-l,.ghead-r{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead-l{left:0;z-index:7;border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 12px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ghead-r{position:sticky;top:0}
.months,.days{display:flex;height:22px;position:relative}
.months div{border-right:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink-2);padding:3px 6px;white-space:nowrap;overflow:hidden;position:relative}
.days{height:20px;border-top:1px solid var(--line)}
.days div{border-right:1px solid var(--line);font-size:10px;color:var(--muted);text-align:center;line-height:20px;overflow:hidden;font-variant-numeric:tabular-nums;flex:none}
.days div.we{background:var(--weekend)}
.grow-l{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;height:34px;overflow:hidden;cursor:pointer}
.grow-l:hover{background:var(--surface-2)}
.grow-l .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.grow-l .ow{color:var(--muted);font-size:11px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.grow-l .pc{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);width:34px;text-align:right;flex:none}
.grow-l.grp{height:38px;font-weight:700;background:var(--surface-2);cursor:pointer}
.grow-l.grp .tt{font-size:13px}
.grow-l .dot{width:8px;height:8px;border-radius:50%;flex:none}
.grow-l .caret{color:var(--muted);font-size:13px;width:18px;flex:none;padding:8px 0;text-align:center}
.grow-r{position:relative;height:34px;border-bottom:1px solid var(--line);background-image:var(--gridimg);background-size:var(--dw) 100%}
.grow-r.grp{height:38px;background-color:var(--surface-2)}
.gbar{position:absolute;top:7px;height:20px;border-radius:5px;background:var(--c);opacity:.28;cursor:grab;touch-action:none;user-select:none}
.gbar .fill{position:absolute;inset:0;width:var(--p);background:var(--c);border-radius:5px 0 0 5px}
.gbar .lbl{position:absolute;left:100%;top:0;line-height:20px;padding-left:6px;white-space:nowrap;font-size:11px;color:var(--ink-2);pointer-events:none}
.gbar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.gbar .h.l{left:-2px}.gbar .h.r{right:-2px}
.gbar:hover{opacity:.4}
.gbar.dragging{opacity:.55;cursor:grabbing}
.gbar.overdue{outline:2px solid var(--crit);outline-offset:-1px}
.gbar.ms{width:14px!important;height:14px;top:10px;transform:rotate(45deg);border-radius:3px;opacity:.85}
.gsum{position:absolute;top:14px;height:10px;border-radius:3px;background:var(--c);opacity:.35}
.gsum i{position:absolute;inset:0;width:var(--p);background:var(--c);border-radius:3px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.8;pointer-events:none;z-index:2}
.today-tag{position:absolute;top:0;font-size:10px;background:var(--today);color:#fff;padding:1px 5px;border-radius:0 0 4px 4px;transform:translateX(-50%);z-index:6}
.addrow{grid-column:1/-1;position:sticky;left:0;padding:6px 12px}
@media (max-width:640px){.gtable{--left:200px}.grow-l .ow{display:none}}

/* ---------- table ---------- */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table.tbl{border-collapse:collapse;width:100%;min-width:900px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;font-weight:700}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.g td{background:var(--surface-2);font-weight:700;padding:8px 10px;cursor:pointer}
.tbl input,.tbl select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;min-width:0}
.tbl input:hover,.tbl select:hover{border-color:var(--line-2)}
.tbl input:focus{border-color:var(--focus);background:var(--surface)}
.tbl input[type=date]{width:130px;font-variant-numeric:tabular-nums}
.tbl input[type=number]{width:64px;text-align:right}
.tbl .open{color:var(--muted)}
.tbl td.st{white-space:nowrap}
.tbl tr:hover td{background:var(--surface-2)}
.prog{display:flex;align-items:center;gap:6px;min-width:120px}
.prog input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
.prog span{width:36px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:31;transform:translateX(100%);transition:transform .22s;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dhead .gsel{flex:1;min-width:0}
.dbody{flex:1;overflow:auto;padding:14px 16px 30px;display:grid;gap:14px;align-content:start}
.f{display:grid;gap:5px}
.f label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.f input,.f select,.f textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{resize:vertical;min-height:64px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--focus);outline:none}
.title-in{font:700 18px/1.3 "Montserrat",Arial,sans-serif;border:1px solid transparent!important;padding:6px 8px!important;margin:0 -8px}
.title-in:hover{border-color:var(--line-2)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dur{font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.dur b{font-variant-numeric:tabular-nums}
.steps{display:grid;gap:4px}
.step{display:flex;align-items:center;gap:8px}
.step input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;flex:none}
.step input[type=text]{flex:1;border:1px solid transparent;border-radius:6px;padding:5px 6px;background:transparent}
.step input[type=text]:hover{border-color:var(--line-2)}
.step input[type=text]:focus{border-color:var(--focus);background:var(--surface)}
.step.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.step .x{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:4px}
.step .x:hover{color:var(--crit);background:var(--crit-soft)}
.addstep{display:flex;gap:6px}
.addstep input{flex:1;border:1px dashed var(--line-2);border-radius:8px;padding:7px 10px;background:transparent}
.files{display:grid;gap:6px}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.file .ic{width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800}
.file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .nm small{display:block;color:var(--muted);font-size:11px}
.file .x{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:4px}
.file .x:hover{color:var(--crit);background:var(--crit-soft)}
.file img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.fileadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkform{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px}
@media (max-width:480px){.linkform{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}}
.hint{font-size:12px;color:var(--muted)}
.dfoot{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.statuspill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.range-in{display:flex;align-items:center;gap:10px}
.range-in input[type=range]{flex:1;accent-color:var(--accent)}
.range-in output{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- list drawer ---------- */
.lhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.lhead h2{margin:0;font:700 17px/1.3 "Montserrat",Arial,sans-serif;flex:1;min-width:0}
.lhead .sub{font-size:12px;color:var(--muted);margin-top:3px}
.lkpi{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.lkpi b{font-size:16px;color:var(--ink);display:block;font-variant-numeric:tabular-nums}
.lgrp{padding:12px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.lgrp i{width:8px;height:8px;border-radius:50%;display:inline-block}
.litem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.litem:hover{background:var(--surface-2)}
.litem .t{font-weight:600}
.litem .m{font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap;grid-column:1/-1}
.litem .p{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.litem .bar{margin-top:6px;grid-column:1/-1}

  const {data:ex}=await sb.from('profiles').select('id,role').eq('email',email).maybeSingle();
  if(ex){ const {error}=await sb.from('profiles').update({role,access}).eq('id',ex.id); if(error) throw error; }
  else { const {error}=await sb.from('invites').upsert({email,role,name:name||'',invited_by:Auth.user.id,accepted_at:null,user_id:null,access}); if(error) throw error; }
  const {error:e2}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname,data:{name:name||''}}});
  if(e2){ const m=e2.message||''; throw new Error(/rate limit/i.test(m)?'Лимит писем исчерпан — подождите час или настройте SMTP (см. Supabase → Auth → SMTP)':m); }
  return ex?'updated':'invited';
}

function dlRow(t){ const g=groupOf(t.groupId); const late=t.end<todayStr(); const d=Math.round((pd(t.end)-pd(todayStr()))/DAY);

/* ---- gantt ---- */
function renderGantt(main){
  const list=filtered().filter(t=>state.showDone||status(t)!=='done');
  const zoomDW={day:36,week:14,month:5}[state.zoom];
  const dated=list.filter(t=>t.start||t.end);
  const today=todayStr();
  let min=today,max=today;
  dated.forEach(t=>{const s=t.start||t.end,e=t.end||t.start; if(s<min)min=s; if(e>max)max=e;});
  min=addDays(min,-7); max=addDays(max,14);
  // align min to Monday
  const mind=new Date(pd(min)); const wd=(mind.getUTCDay()+6)%7; min=addDays(min,-wd);
  const total=Math.round((pd(max)-pd(min))/DAY)+1;
  const x=s=>Math.round((pd(s)-pd(min))/DAY)*zoomDW;
  // months
  let months='',cur=pd(min),endT=pd(max);
  while(cur<=endT){ const d=new Date(cur); const mEnd=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1); const to=Math.min(mEnd,endT+DAY); const w=Math.round((to-cur)/DAY)*zoomDW; months+=`<div style="width:${w}px;flex:none">${w>40?MONTHS_F[d.getUTCMonth()]+' '+d.getUTCFullYear():''}</div>`; cur=to; }
  let daysH='';
  if(state.zoom==='day'){ for(let i=0;i<total;i++){const d=new Date(pd(min)+i*DAY);const we=d.getUTCDay()===0||d.getUTCDay()===6;daysH+=`<div class="${we?'we':''}" style="width:${zoomDW}px">${d.getUTCDate()}</div>`;} }
  else if(state.zoom==='week'){ for(let i=0;i<total;i+=7){const d=new Date(pd(min)+i*DAY);daysH+=`<div style="width:${zoomDW*7}px">${d.getUTCDate()}.${String(d.getUTCMonth()+1).padStart(2,'0')}</div>`;} }
  else { for(let i=0;i<total;i+=7){const d=new Date(pd(min)+i*DAY);daysH+=`<div style="width:${zoomDW*7}px"></div>`;} }
  const gridStep=state.zoom==='day'?zoomDW:zoomDW*7;
  const todayX=x(today)+Math.floor(zoomDW/2);
  let rows='';
  sortedGroups().forEach(g=>{
    const gt=list.filter(t=>t.groupId===g.id).sort((a,b)=>(a.order||0)-(b.order||0));
    if(state.fGroup && g.id!==state.fGroup) return;

    rows+=`<div class="grow-l grp" data-g="${g.id}"><span class="caret">${col?'▸':'▾'}</span><span class="dot" style="background:${gcolor(g)}"></span><span class="tt">${esc(g.name)}</span><span class="ow">${st.n}</span><span class="pc">${st.pct}%</span></div><div class="grow-r grp">${st.start?`<div class="gsum" style="--c:${gcolor(g)};--p:${st.pct}%;left:${x(st.start)}px;width:${Math.max(zoomDW,(x(st.end)-x(st.start)+zoomDW))}px"><i></i></div>`:''}</div>`;
    if(col) return;
    gt.forEach(t=>{
      const s=t.start||t.end, e=t.end||t.start; const stt=status(t);
      const w=s?Math.max(zoomDW,x(e)-x(s)+zoomDW):0;
      const ms=s&&s===e;
      rows+=`<div class="grow-l" data-t="${t.id}" title="${esc(t.title)}"><span class="tt">${esc(t.title)}</span><span class="ow">${esc(t.owner||'')}</span><span class="pc" style="color:${STATUS_C[stt]}">${t.progress||0}%</span></div>
      <div class="grow-r">${s?`<div class="gbar ${stt==='overdue'?'overdue':''} ${ms?'ms':''}" data-t="${t.id}" style="--c:${gcolor(g)};--p:${t.progress||0}%;left:${x(s)}px;width:${w}px" title="${fmtFull(s)} — ${fmtFull(e)}"><div class="fill"></div>${ms?'':'<div class="h l"></div><div class="h r"></div>'}<span class="lbl">${ms?esc(t.title):fmt(s)+' – '+fmt(e)}</span></div>`:'<span class="hint" style="line-height:34px;padding-left:8px">без дат — откройте задачу</span>'}</div>`;
    });
    if(!state.ro) rows+=`<div class="grow-l" style="height:30px"><button class="btn ghost sm addin" data-g="${g.id}">＋ задача</button></div><div class="grow-r" style="height:30px"></div>`;
  });
  const prevScroll = main.querySelector('.gantt')?{l:main.querySelector('.gantt').scrollLeft,t:main.querySelector('.gantt').scrollTop}:null;
  main.innerHTML=`<div class="gtoolbar">
    <div class="tabs" id="zoom"><button data-z="day" aria-selected="${state.zoom==='day'}">Дни</button><button data-z="week" aria-selected="${state.zoom==='week'}">Недели</button><button data-z="month" aria-selected="${state.zoom==='month'}">Месяцы</button></div>
    <button class="btn" id="goToday">Сегодня</button>
    <label class="btn" style="cursor:pointer"><input type="checkbox" id="showDone" ${state.showDone?'checked':''} style="accent-color:var(--accent)"> показывать выполненные</label>
    <span class="hint">${state.ro?'Режим просмотра. Клик по задаче — карточка, по группе — её состав, ▾ сворачивает группу.':'Полосы перетаскиваются (сдвиг сроков), края — длительность. Клик по задаче — карточка, по группе — её состав, ▾ сворачивает группу.'}</span>
  </div>
  <div class="gantt" id="gantt"><div class="gtable" style="--dw:${gridStep}px;--gridimg:linear-gradient(to right,var(--line) 1px,transparent 1px)">
    <div class="ghead-l">Задача</div><div class="ghead-r" style="width:${total*zoomDW}px"><div class="months">${months}</div><div class="days">${daysH}</div><div class="today-tag" style="left:${todayX}px">сегодня</div></div>
    ${rows}
  </div><div class="today" style="left:${$('.gtable')?0:0}px" hidden></div></div>`;
  // today line: absolute inside each right row is heavy; use one overlay positioned relative to gtable
  const gt=main.querySelector('.gtable'); const leftW=parseInt(getComputedStyle(gt).getPropertyValue("--left"))||380;
  const line=document.createElement('div'); line.className='today'; line.style.left=(leftW+todayX)+'px'; line.style.top='0'; line.style.position='absolute'; line.style.height=gt.scrollHeight+'px'; gt.style.position='relative'; gt.appendChild(line);
  if(!list.length){ main.querySelector('#gantt').innerHTML=`<div class="empty" style="padding:24px">Нечего показывать: ${state.showDone?'в выбранных группах нет задач':'все задачи выполнены — включите «показывать выполненные»'}.</div>`; }
  const gEl=main.querySelector('#gantt');
  if(prevScroll){gEl.scrollLeft=prevScroll.l;gEl.scrollTop=prevScroll.t;} else { gEl.scrollLeft=Math.max(0,todayX-gEl.clientWidth/2+leftW/2); }
  main.querySelectorAll('#zoom button').forEach(b=>b.onclick=()=>{state.zoom=b.dataset.z;state._noScroll=true;render();});
  main.querySelector('#goToday').onclick=()=>{gEl.scrollTo({left:Math.max(0,todayX-gEl.clientWidth/2+leftW/2),behavior:'smooth'});};
  main.querySelector('#showDone').onchange=e=>{state.showDone=e.target.checked;render();};
  main.querySelectorAll('.grow-l.grp').forEach(el=>{ el.onclick=e=>{ if(e.target.classList.contains('caret')){ state.collapsed[el.dataset.g]=!state.collapsed[el.dataset.g]; render(); } else openList('group',el.dataset.g,groupOf(el.dataset.g)?.name||''); }; });
  if(!state.ro) main.querySelectorAll('.grow-l.grp').forEach(el=>{ el.oncontextmenu=e=>{e.preventDefault();groupModal(groupOf(el.dataset.g));}; el.ondblclick=()=>groupModal(groupOf(el.dataset.g)); });
  main.querySelectorAll('.grow-l[data-t]').forEach(el=>el.onclick=()=>openTask(el.dataset.t));
  main.querySelectorAll('.addin').forEach(b=>b.onclick=e=>{e.stopPropagation();newTask(b.dataset.g);});
  // drag
  main.querySelectorAll('.gbar').forEach(bar=>{
    bar.addEventListener('pointerdown',e=>{
      if(e.button!==0) return;
      const t=state.tasks.find(x=>x.id===bar.dataset.t); if(!t||!Store.canWrite||state.ro) return;
      const mode=e.target.classList.contains('h')?(e.target.classList.contains('l')?'l':'r'):'move';
      const sx=e.clientX, left0=parseFloat(bar.style.left), w0=parseFloat(bar.style.width);
      let moved=false; bar.setPointerCapture(e.pointerId); state.dragging=true;
      const mv=ev=>{ const dx=ev.clientX-sx; const dd=Math.round(dx/zoomDW); if(Math.abs(dx)>3) moved=true; bar.classList.add('dragging');
        if(mode==='move'){ bar.style.left=(left0+dd*zoomDW)+'px'; }
        else if(mode==='r'){ bar.style.width=Math.max(zoomDW,w0+dd*zoomDW)+'px'; }
        else { const nl=Math.min(left0+w0-zoomDW,left0+dd*zoomDW); bar.style.left=nl+'px'; bar.style.width=(w0+left0-nl)+'px'; }
        const s=t.start||t.end,en=t.end||t.start; let ns=s,ne=en;
        if(mode==='move'){ns=addDays(s,dd);ne=addDays(en,dd);} else if(mode==='r'){ne=addDays(en,Math.max(dd,-(days(s,en)-1)));} else {ns=addDays(s,Math.min(dd,days(s,en)-1));}
        bar.querySelector('.lbl').textContent=fmt(ns)+' – '+fmt(ne); bar._ns=ns; bar._ne=ne; };
      const up=ev=>{ bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); bar.removeEventListener('pointercancel',up); state.dragging=false; bar.classList.remove('dragging');
        if(moved && bar._ns){ Store.saveTask({...t,start:bar._ns,end:bar._ne}); render(); }
        else if(!moved){ openTask(t.id); } else render(); };
      bar.addEventListener('pointermove',mv); bar.addEventListener('pointerup',up); bar.addEventListener('pointercancel',up);
    });
  });
}

  main.innerHTML=`<datalist id="ownersDL">${ownersDL.map(o=>`<option value="${esc(o)}">`).join('')}</datalist><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="min-width:220px">Задача</th><th style="min-width:140px">Ответственный</th><th>Начало</th><th>Завершение</th><th style="min-width:140px">Выполнено</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  main.querySelectorAll('tr[data-t] [data-f]').forEach(inp=>{
    const id=inp.closest('tr').dataset.t;
    const commit=()=>{ const t=state.tasks.find(x=>x.id===id); if(!t) return; let v=inp.value; if(inp.dataset.f==='progress') v=+v; if(t[inp.dataset.f]===v) return; Store.saveTask({...t,[inp.dataset.f]:v}); if(inp.type==='range'||inp.type==='date') render(); };
    inp.addEventListener('change',commit);
    if(inp.type==='range') inp.addEventListener('input',()=>inp.nextElementSibling.textContent=inp.value+'%');
    if(inp.type==='text') inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();});

  });
  main.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTask(b.dataset.open));
  main.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();groupModal(groupOf(b.dataset.edit));});
  main.querySelectorAll('tr.g').forEach(r=>r.onclick=()=>openList('group',r.dataset.g,groupOf(r.dataset.g)?.name||''));

  gid=gid||state.fGroup||sortedGroups()[0]?.id; if(!gid){ groupModal(); return; }
  const order=Math.max(0,...tasksOf(gid).map(t=>t.order||0))+1;
  const t={id:uid(),groupId:gid,title:'',result:'',owner:'',progress:0,start:todayStr(),end:addDays(todayStr(),7),notes:'',steps:[],files:[],hoursPlan:null,hoursFact:null,order,createdAt:Date.now(),createdBy:myEmail(),createdByName:(Auth.profile&&Auth.profile.name)||''};
  Store.saveTask(t); state.newTaskId=t.id; openTask(t.id,true);
}
function openTask(id,focusTitle){ state.openTask=id; renderDrawer(true,focusTitle); seenTask(id); }
function flushDrawer(){ const ae=document.activeElement; if(ae&&$('#drawer').contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) ae.blur(); }
function closeDrawer(){ state.openTask=null; state.newTaskId=null; state.listView=null; flushDrawer(); $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); render(); }

  async dashPdf(){

      const iw=pw-2*m, ih=canvas.height*iw/canvas.width; const pageH=ph-2*m;
      let y=0; let first=true;
      while(y<canvas.height){ const sliceH=Math.min(canvas.height-y, pageH*canvas.width/iw); const c=document.createElement('canvas'); c.width=canvas.width; c.height=sliceH; c.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
        if(!first) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,sliceH*iw/canvas.width); first=false; y+=sliceH; }

    }catch(e){ toast('Не удалось собрать PDF: '+(e?.message||e)); }

Store.subscribeExtra=function(){
  if(this.mode!=='db') return;
  const apply=(arrName,payload)=>{ const arr=state[arrName]; const row=payload.new&&payload.new.id?payload.new:null; const oldId=payload.old&&payload.old.id;
    if(payload.eventType==='DELETE'){ const i=arr.findIndex(x=>x.id===oldId); if(i>=0) arr.splice(i,1); }
    else if(row){ const obj={...row.data,id:row.id}; const i=arr.findIndex(x=>x.id===row.id); if(i>=0) arr[i]=obj; else arr.push(obj); }
    if(!state.dragging) render(); };
  sb.channel('smth-extra')
    .on('postgres_changes',{event:'*',schema:'public',table:'meetings'},p=>apply('meetings',p))
    .on('postgres_changes',{event:'*',schema:'public',table:'documents'},p=>apply('docs',p))
    .subscribe();
};

/* ---------- Календарь: .ics и Google Calendar ---------- */
const Cal={
  stamp(d,t){ const [y,mo,da]=d.split('-'); const [h,mi]=(t||'09:00').split(':'); return `${y}${mo}${da}T${h}${mi}00`; },
  endOf(m){ if(m.end) return m.end; const [h,mi]=(m.start||'09:00').split(':').map(Number); const e=new Date(Date.UTC(2000,0,1,h,mi)+3600000); return String(e.getUTCHours()).padStart(2,'0')+':'+String(e.getUTCMinutes()).padStart(2,'0'); },
  where(m){ return m.kind==='offline'?(m.location||''):(m.link||KIND_L[m.kind]||''); },
  ics(m){ const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
    const desc=[m.notes||'',m.kind!=='offline'&&m.link?'Ссылка: '+m.link:'',SITE_URL].filter(Boolean).join('\n');
    const att=(m.participants||[]).filter(p=>p.email).map(p=>`ATTENDEE;CN=${e(p.name||p.email)};RSVP=TRUE:mailto:${p.email}`);
    const org=Auth.profile?.email?`ORGANIZER;CN=${e(Auth.profile.name||Auth.profile.email)}:mailto:${Auth.profile.email}`:'';
    const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
    return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SMTH//Plan//RU','CALSCALE:GREGORIAN','METHOD:REQUEST',
      'BEGIN:VTIMEZONE','TZID:Europe/Moscow','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0300','TZOFFSETTO:+0300','TZNAME:MSK','END:STANDARD','END:VTIMEZONE',
      'BEGIN:VEVENT',`UID:${m.id}@smthproject.ru`,`DTSTAMP:${now}`,`SEQUENCE:${Math.floor((m.updatedAt||0)/1000)%100000}`,`DTSTART;TZID=Europe/Moscow:${this.stamp(m.date,m.start)}`,`DTEND;TZID=Europe/Moscow:${this.stamp(m.date,this.endOf(m))}`,
      `SUMMARY:${e(m.title||'Встреча')}`,`DESCRIPTION:${e(desc)}`,`LOCATION:${e(this.where(m))}`,m.kind!=='offline'&&m.link?`URL:${m.link}`:'',org,...att,'STATUS:CONFIRMED','BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Встреча через 30 минут','END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n'); },
  googleUrl(m){ const p=new URLSearchParams({action:'TEMPLATE',text:m.title||'Встреча',dates:`${this.stamp(m.date,m.start)}/${this.stamp(m.date,this.endOf(m))}`,ctz:'Europe/Moscow',details:[m.notes||'',m.kind!=='offline'&&m.link?m.link:'',SITE_URL].filter(Boolean).join('\n'),location:this.where(m)}); return 'https://calendar.google.com/calendar/render?'+p.toString(); },
  download(m){ const blob=new Blob([this.ics(m)],{type:'text/calendar;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`smth_${(m.title||'meeting').replace(/[^\wА-Яа-яЁё -]/g,'').slice(0,40)}_${m.date}.ics`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
};

/* ---------- Store ---------- */
Store.loadChat=async function(){ if(this.mode!=='db') return;
  const [c,r]=await Promise.all([sb.from('comments').select('*').order('created_at'),sb.from('task_reads').select('task_id,read_at')]);
  if(c.error){ if(/relation .*comments/.test(c.error.message)){ toast('Обсуждения недоступны: выполните schema_v3.sql в Supabase'); return; } throw new Error(c.error.message); } if(r.error) throw new Error(r.error.message);
  state.comments=c.data||[]; state.reads={}; (r.data||[]).forEach(x=>state.reads[x.task_id]=x.read_at); };
Store.markRead=async function(taskId){ const now=new Date().toISOString(); state.reads[taskId]=now; renderBell(); if(this.mode!=='db'||!myId()) return;
  await sb.from('task_reads').upsert({user_id:myId(),task_id:taskId,read_at:now}); };
Store.addComment=async function(taskId,body){ if(this.mode!=='db'){ toast('Обсуждение работает только на сайте (нужен вход)'); return null; }
  const row={task_id:taskId,author_id:myId(),author_name:(Auth.profile&&Auth.profile.name)||'',author_email:myEmail(),body};
  const {data,error}=await sb.from('comments').insert(row).select().single();
  if(error){ toast('Сообщение не отправлено: '+error.message); return null; }
  if(!state.comments.find(c=>c.id===data.id)) state.comments.push(data);
  await this.markRead(taskId); return data; };
Store.deleteComment=async function(id){ state.comments=state.comments.filter(c=>c.id!==id); const {error}=await sb.from('comments').delete().eq('id',id); if(error) toast('Не удалилось: '+error.message); };
Store.subscribeChat=function(){ if(this.mode!=='db') return;
  sb.channel('smth-chat').on('postgres_changes',{event:'*',schema:'public',table:'comments'},p=>{
    if(p.eventType==='DELETE'){ state.comments=state.comments.filter(c=>c.id!==(p.old&&p.old.id)); }
    else if(p.new&&p.new.id){ if(!state.comments.find(c=>c.id===p.new.id)) state.comments.push(p.new);
      if(p.new.author_id!==myId()){ if(state.openTask===p.new.task_id&&!document.hidden) Store.markRead(p.new.task_id);
        else { const t=state.tasks.find(x=>x.id===p.new.task_id); toast(`💬 ${p.new.author_name||p.new.author_email}: ${(t&&t.title)||'задача'}`); } } }
    renderBell(); if(state.openTask) refreshDrawer(); else if(state.view==='table'||state.listView) render();
  }).subscribe(); };

Mail.commentHtml=function(t,c){ const g=groupOf(t.groupId);
  return this.wrap('Сообщение по задаче: '+(t.title||'без названия'),`<p style="margin:0 0 6px;color:#5A5E63;font-size:13px">${esc(c.author_name||c.author_email)} · ${esc(g?g.name:'')}${t.end?' · срок '+esc(fmtFull(t.end)):''}</p><div style="background:#F6F4EF;border-left:3px solid #FE5000;padding:12px 14px;border-radius:6px;white-space:pre-wrap">${esc(c.body)}</div>`,{url:SITE_URL,label:'Открыть обсуждение'}); };
Mail.notifyComment=async function(t,c){
  const set=new Set(parseEmails(t.ownerEmail));
  cmtOf(t.id).forEach(x=>{ if(x.author_email) set.add(x.author_email.toLowerCase()); });
  state.team.filter(u=>u.role==='admin'&&u.email).forEach(u=>set.add(u.email));
  set.delete(myEmail()); const to=[...set]; if(!to.length) return;

function bindChat(dr,t){ const box=dr.querySelector('#d_msgs'); if(box) box.scrollTop=box.scrollHeight;
  const ta=dr.querySelector('#d_msg'); const sendB=dr.querySelector('#d_send'); if(!ta||!sendB) return; ta.disabled=false; sendB.hidden=false;

function accessLabel(a){ if(!a) return ''; const parts=[]; if(a.groups) parts.push(a.groups.length?'группы: '+a.groups.map(id=>groupOf(id)?.name||'?').join(', '):'группы: нет'); if(a.folders) parts.push(a.folders.length?'папки: '+a.folders.join(', '):'папки: нет'); return parts.join(' · ')||''; }
function accessFormHtml(a){ const gs=sortedGroups(); const fs=[...new Set(['Общее',...docFolders(),...sortedGroups().map(g=>g.name)])];
  const box=(name,items,sel)=>`<div class="accbox"><label class="chk"><input type="radio" name="${name}_m" value="all" ${!sel?'checked':''}> Ко всем ${name==='g'?'группам задач':'папкам документов'}</label><label class="chk"><input type="radio" name="${name}_m" value="some" ${sel?'checked':''}> Только к выбранным:</label>
    <div class="acclist" ${sel?'':'style="opacity:.5"'}>${items.map(it=>`<label class="chk"><input type="checkbox" data-${name}="${esc(it.id)}" ${sel&&sel.includes(it.id)?'checked':''}> ${esc(it.name)}</label>`).join('')||'<span class="hint">пока пусто</span>'}</div></div>`;
  return `<div class="row2" style="align-items:start">${box('g',gs.map(g=>({id:g.id,name:g.name})),a&&a.groups)}${box('f',fs.map(f=>({id:f,name:f})),a&&a.folders)}</div>`; }
function accessFormRead(root){ const pick=(name)=>{ const m=root.querySelector(`input[name="${name}_m"]:checked`)?.value; if(m!=='some') return undefined; return [...root.querySelectorAll(`input[data-${name}]:checked`)].map(i=>i.dataset[name]); };
  const g=pick('g'), f=pick('f'); if(g===undefined&&f===undefined) return null; const a={}; if(g!==undefined) a.groups=g; if(f!==undefined) a.folders=f; return a; }
function accessFormBind(root){ root.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{ root.querySelectorAll('.accbox').forEach(b=>{ const m=b.querySelector('input[type=radio]:checked')?.value; b.querySelector('.acclist').style.opacity=m==='some'?'1':'.5'; }); }); }
async function accessModal(u){ // u: {id?, email, name, access, invite?}

/* =========================================================
   v5 — кто онлайн, мои задачи (новые / в работе / завершены), участники задачи,
        документы задач в папке группы, редактирование имени пользователя
   ========================================================= */
state.online={};

/* ---------- кто сейчас в системе ---------- */
Store.presence=function(){ if(this.mode!=='db'||!Auth.user) return;
  const ch=sb.channel('smth-online',{config:{presence:{key:Auth.user.id}}}); this.presenceCh=ch;
  ch.on('presence',{event:'sync'},()=>{ const st=ch.presenceState(); state.online={}; Object.entries(st).forEach(([k,arr])=>{ if(arr&&arr[0]) state.online[k]=arr[0]; }); renderOnline(); })
    .subscribe(async s=>{ if(s==='SUBSCRIBED') await ch.track({email:myEmail(),name:(Auth.profile&&Auth.profile.name)||'',at:Date.now()}); });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ch) ch.track({email:myEmail(),name:(Auth.profile&&Auth.profile.name)||'',at:Date.now()}); }); };
const isOnline=email=>Object.values(state.online).some(p=>p.email===(email||'').toLowerCase());
function renderOnline(){ const n=$('#onlineN'), m=$('#onlineMenu'), b=$('#onlineBtn'); if(!n||!m) return; const list=Object.values(state.online).sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email,'ru'));
  n.textContent=list.length; b.hidden=false;
  const off=state.team.filter(u=>!isOnline(u.email)&&u.role!=='pending'&&u.role!=='blocked');
  m.innerHTML=`<div class="hint" style="padding:4px 10px">Сейчас на сайте · ${list.length}</div>${list.map(p=>`<div class="onl"><i class="on"></i>${esc(p.name||p.email)}${p.email===myEmail()?' <span class="hint">(вы)</span>':''}</div>`).join('')}${off.length?`<div class="hint" style="padding:8px 10px 4px;border-top:1px solid var(--line);margin-top:4px">Не в сети</div>${off.map(u=>`<div class="onl"><i></i>${esc(u.name||u.email)}</div>`).join('')}`:''}`; }
(function(){ const b=$('#onlineBtn'), m=$('#onlineMenu'); if(!b) return; b.onclick=e=>{ e.stopPropagation(); m.hidden=!m.hidden; }; document.addEventListener('click',e=>{ if(!e.target.closest('#onlineDD')) m.hidden=true; }); })();

/* ---------- мои задачи ---------- */
const emailByName=n=>{ n=(n||'').trim().toLowerCase(); if(!n) return ''; const u=state.team.find(u=>(u.name||'').trim().toLowerCase()===n); return u?u.email:''; };
const taskPeople=t=>{ const own=parseEmails(t.ownerEmail); const byName=own.length?[]:[emailByName(t.owner)].filter(Boolean); return [...new Set([...own,...byName,...parseEmails(t.participants)])]; };
const myName=()=>((Auth.profile&&Auth.profile.name)||'').trim().toLowerCase();
const isMine=t=>taskPeople(t).includes(myEmail())||(!!myName()&&(t.owner||'').trim().toLowerCase()===myName())||(typeof puckOwner==='function'&&puckOwner(t)===myEmail());
function myState(t){ if((t.progress||0)>=100) return 'done'; const r=state.reads[t.id]; const a=t.assignedAt?new Date(t.assignedAt).toISOString():null; if(!r||(a&&r<a)) return 'new'; return 'progress'; }
let myTasks=()=>state.tasks.filter(isMine);
let myNew=()=>myTasks().filter(t=>myState(t)==='new');
function seenTask(id){ const t=state.tasks.find(x=>x.id===id); if(t&&isMine(t)&&myState(t)==='new') Store.markRead(id); }
function myTasksPanel(){ const mine=myTasks(); if(!mine.length) return `<div class="panel my"><h2>Мои задачи</h2><div class="hint">Пока нет задач, где вы ответственный или участник. Задача попадает сюда, когда в её карточке указан ваш email ответственного (или ваше имя, как в профиле), вы добавлены в участники или ход по шагу за вами.</div></div>`; const by={new:[],progress:[],done:[]}; mine.forEach(t=>by[myState(t)].push(t));
  const srt=a=>a.sort((x,y)=>(x.end||'9999').localeCompare(y.end||'9999'));
  const col=(k,title,cls)=>`<div class="mycol"><div class="myh ${cls}">${title} <b>${by[k].length}</b></div><div class="dl">${srt(by[k]).map(t=>{ const g=groupOf(t.groupId); const late=t.end&&t.end<todayStr()&&k!=='done'; return `<div class="dl-row" data-t="${t.id}"><span class="d" style="${late?'color:var(--crit)':''}">${t.end?fmt(t.end):'—'}</span><span class="t"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${gcolor(g)};margin-right:6px"></i>${esc(t.title||'без названия')}${k==='new'?'<span class="badge">new</span>':''}${(typeof puckOwner==='function'&&puckOwner(t)===myEmail())?'<span class="badge" style="background:var(--ink)">🏒 ваш ход</span>':''}</span><span class="o">${t.progress||0}%</span></div>`; }).join('')||'<div class="empty">—</div>'}</div></div>`;
  return `<div class="panel my"><h2>Мои задачи <span class="hint" style="font-weight:400">· ${mine.length} · ответственный или участник</span></h2><div class="mygrid">${col('new','Новые','n')}${col('progress','В работе','p')}${col('done','Завершены','d')}</div></div>`; }

/* ---------- участники задачи: уведомления ---------- */
Mail.notifyPeople=async function(t,emails){ const to=parseEmails(emails.join(',')); if(!to.length) return false;
  const ok=await this.send({to,subject:`Задача: ${t.title||'без названия'} · до ${t.end?fmtFull(t.end):'—'}`,html:this.taskHtml(t),text:`Вам назначена задача «${t.title}». Срок: ${t.end?fmtFull(t.end):'—'}. ${SITE_URL}`});
  if(ok) Store.saveTask({...(state.tasks.find(x=>x.id===t.id)||t),notifiedAt:Date.now()}); return ok; };
Mail.notifyTask=async function(t){ const to=taskPeople(t); if(!to.length){ toast('У ответственного не указан email'); return false; } return this.notifyPeople(t,to); };
function bindParticipants(dr,t,save){ const ta=dr.querySelector('#d_part'); if(!ta) return;
  const commit=async()=>{ const v=parseEmails(ta.value).join(', '); const cur=state.tasks.find(x=>x.id===t.id); if(!cur||v===(cur.participants||'')) return; const before=parseEmails(cur.participants); const added=parseEmails(v).filter(e=>!before.includes(e)&&e!==myEmail()); save({participants:v,assignedAt:Date.now()}); if(added.length&&t.id!==state.newTaskId){ const upd=state.tasks.find(x=>x.id===t.id); await Mail.notifyPeople(upd,added); } render(); refreshDrawer(); };
  ta.addEventListener('change',commit);
  dr.querySelectorAll('#d_pteam [data-e]').forEach(b=>b.onmousedown=e=>e.preventDefault());
  dr.querySelectorAll('#d_pteam [data-e]').forEach(b=>b.onclick=()=>{ const cur=parseEmails(ta.value); if(!cur.includes(b.dataset.e)) cur.push(b.dataset.e); ta.value=cur.join(', '); commit(); });
  dr.querySelectorAll('#d_oteam [data-e]').forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ const oe=dr.querySelector('#d_oemail'); oe.value=b.dataset.e; oe.dispatchEvent(new Event('change')); }; }); }
function teamChips(id,exclude){ const list=state.team.filter(u=>u.email&&!exclude.includes(u.email)&&u.role!=='pending'&&u.role!=='blocked'); return list.length?`<div class="chips" id="${id}">${list.map(u=>`<button type="button" class="chip planned" data-e="${esc(u.email)}" title="${esc(u.email)}">${isOnline(u.email)?'<i class="on"></i>':''}＋ ${esc(u.name||u.email)}</button>`).join('')}</div>`:''; }
function participantsHtml(t){ const cur=parseEmails(t.participants); return `<div class="f"><label>Участники задачи</label><textarea id="d_part" rows="1" placeholder="email участников через запятую — они получат письмо и увидят задачу в «Мои задачи»">${esc(t.participants||'')}</textarea>${cur.length?`<div class="hint">${cur.map(e=>esc(personLabel(e))).join(' · ')}</div>`:''}${state.ro?'':teamChips('d_pteam',[...cur,...parseEmails(t.ownerEmail)])}</div>`; }

/* ---------- пользователи: правка имени / email ---------- */
function renameModal(u,isInvite){

/* =========================================================
   v6 — автор задачи, ответственные за шаги и «шайба» (у кого сейчас ход), связи задач (основание / подчинённые)
   ========================================================= */
const teamName=e=>{ const u=teamByEmail(e); return (u&&u.name)||e||''; };

/* ---------- шаги: ответственный и шайба ---------- */
function puckStep(t){ return (t.steps||[]).find(s=>!s.done)||null; }
function puckOwner(t){ const s=puckStep(t); return s&&s.owner?String(s.owner).toLowerCase():''; }
function puckBar(t){ const steps=t.steps||[]; if(!steps.length) return ''; const s=puckStep(t);
  if(!s) return `<div class="puckbar done">✓ Все шаги выполнены</div>`;
  const idx=steps.indexOf(s)+1; const who=s.owner?`<b>${esc(teamName(s.owner))}</b>${isOnline(s.owner)?' <i class="on"></i>':''}`:'<b class="hint">ответственный за шаг не назначен</b>';
  return `<div class="puckbar ${s.owner===myEmail()?'me':''}">🏒 Сейчас ход: ${who} — шаг ${idx}/${steps.length} «${esc(s.title||'')}»${s.owner===myEmail()?' · <b>от вас требуется действие</b>':''}</div>`; }
function puckTag(t){ const o=puckOwner(t); if(!o) return ''; return `<span class="ptag ${o===myEmail()?'me':''}" title="Сейчас ход у: ${esc(teamName(o))}">🏒 ${esc(teamName(o))}</span>`; }
function stepOwnerSel(s){ const opts=state.team.filter(u=>u.email&&u.role!=='pending'&&u.role!=='blocked').map(u=>`<option value="${esc(u.email)}"${s.owner===u.email?' selected':''}>${esc(u.name||u.email)}</option>`).join(''); return `<select class="sown" title="Ответственный за шаг"><option value="">— кто</option>${opts}${s.owner&&!teamByEmail(s.owner)?`<option value="${esc(s.owner)}" selected>${esc(s.owner)}</option>`:''}</select>`; }
async function puckMoved(taskId,before){ const t=state.tasks.find(x=>x.id===taskId); if(!t) return; const after=puckOwner(t); if(!after||after===before) return;
  Store.saveTask({...t,puckAt:Date.now()}); if(after===myEmail()) return; const s=puckStep(t); const g=groupOf(t.groupId);
  await Mail.send({to:[after],subject:`🏒 Ваш ход: ${t.title||'задача'} — «${s.title||''}»`,html:Mail.wrap('Теперь ход за вами',`<p style="margin:0 0 10px">${esc((Auth.profile&&Auth.profile.name)||myEmail())} передал(а) вам шаг по задаче <b>${esc(t.title||'')}</b>${g?' · '+esc(g.name):''}.</p><div style="background:#F6F4EF;border-left:3px solid #FE5000;padding:12px 14px;border-radius:6px"><b>Шаг:</b> ${esc(s.title||'')}<br><b>Срок задачи:</b> ${t.end?esc(fmtFull(t.end)):'—'}</div>`,{url:SITE_URL,label:'Открыть задачу'}),text:`Ваш ход по задаче «${t.title}»: шаг «${s.title}». ${SITE_URL}`}); }
function stepOwnerChange(taskId,sid,email){ const cur=state.tasks.find(x=>x.id===taskId); if(!cur) return; const before=puckOwner(cur); Store.saveTask({...cur,steps:(cur.steps||[]).map(s=>s.id===sid?{...s,owner:(email||'').toLowerCase()}:s)}); puckMoved(taskId,before); render(); refreshDrawer(); }

/* ---------- связи задач: основание и подчинённые ---------- */
const parentOf=t=>t.parentId?state.tasks.find(x=>x.id===t.parentId)||null:null;
const childrenOf=id=>state.tasks.filter(x=>x.parentId===id);
function descendants(id){ const out=new Set(); const walk=i=>childrenOf(i).forEach(c=>{ if(!out.has(c.id)){ out.add(c.id); walk(c.id); } }); walk(id); return out; }
function chainOf(t){ const arr=[]; let p=parentOf(t); let n=0; while(p&&n<20){ arr.unshift(p); p=parentOf(p); n++; } return arr; }
function linksHtml(t){ const desc=descendants(t.id); const opts=sortedGroups().map(g=>{ const ts=tasksOf(g.id).filter(x=>x.id!==t.id&&!desc.has(x.id)); return ts.length?`<optgroup label="${esc(g.name)}">${ts.map(x=>`<option value="${x.id}"${t.parentId===x.id?' selected':''}>${esc(x.title||'без названия')}</option>`).join('')}</optgroup>`:''; }).join('');
  const chain=chainOf(t); const kids=childrenOf(t.id);
  return `<div class="f"><label>Связи · основание и подчинённые задачи</label>
    ${chain.length?`<div class="chain">${chain.map(p=>`<button type="button" class="lnk" data-open="${p.id}">${esc(p.title||'без названия')}</button> ›`).join(' ')} <b>${esc(t.title||'эта задача')}</b></div>`:''}
    <div class="linkrow"><span class="hint">Основание:</span><select id="d_parent" ${state.ro?'disabled':''}><option value="">— нет (самостоятельная задача)</option>${opts}</select></div>
    <div class="kids">${kids.length?kids.map(k=>`<div class="kid"><button type="button" class="lnk" data-open="${k.id}">↳ ${esc(k.title||'без названия')}</button><span class="chip ${status(k)}">${STATUS_L[status(k)]}</span><span class="hint">${k.progress||0}% · ${esc(teamName(k.ownerEmail)||k.owner||'')}</span></div>`).join(''):'<div class="hint">Подчинённых задач нет</div>'}</div>
    ${state.ro?'':`<div><button type="button" class="btn sm" id="d_newkid">＋ Подчинённая задача</button></div>`}
  </div>`; }
function bindLinks(dr,t,save){ const sel=dr.querySelector('#d_parent'); if(sel){ sel.onchange=()=>{ save({parentId:sel.value||null}); render(); refreshDrawer(); }; }
  dr.querySelectorAll('.lnk[data-open]').forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ flushDrawer(); openTask(b.dataset.open); }; });
  const nk=dr.querySelector('#d_newkid'); if(nk){ nk.onmousedown=e=>e.preventDefault(); nk.onclick=()=>{ flushDrawer(); const parentId=t.id, gid=t.groupId; newTask(gid); const nt=state.tasks.find(x=>x.id===state.newTaskId); if(nt){ Store.saveTask({...nt,parentId}); renderDrawer(true,true); } }; } }
function authorLine(t){ const who=t.createdByName||teamName(t.createdBy)||''; const when=t.createdAt?new Date(t.createdAt).toLocaleDateString('ru-RU'):''; return (who||when)?`<div class="hint author">Автор: <b>${esc(who||'—')}</b>${when?' · создана '+when:''}${t.parentId&&parentOf(t)?' · основание: <b>'+esc(parentOf(t).title||'')+'</b>':''}</div>`:''; }

/* =========================================================
   v7 — важность вместо порядка; подзадачи = подчинённые задачи, редактируемые внутри карточки;
        шайба по подзадачам; латиница в путях файлов
   ========================================================= */
const PRIO={low:'Низкая',normal:'Обычная',high:'Высокая',critical:'Критическая'};
function prioTag(t){ const p=t.priority||'normal'; if(p==='normal') return ''; return `<span class="prio p-${p}" title="Важность">${p==='critical'?'‼':'!'} ${PRIO[p]}</span>`; }
function translit(s){ const m={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'}; return String(s).split('').map(ch=>{ const l=ch.toLowerCase(); return l in m?(ch===l?m[l]:m[l].toUpperCase()):ch; }).join(''); }

/* ---------- подзадачи (дочерние задачи) ---------- */
const subsOf=t=>childrenOf(t.id).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0));
const subDone=k=>(k.progress||0)>=100;
const subOwnerEmail=k=>parseEmails(k.ownerEmail)[0]||emailByName(k.owner)||'';
function migrateSteps(t){ if(!(t.steps&&t.steps.length)||state.ro||!Store.canWrite) return; const base=Math.max(0,...childrenOf(t.id).map(x=>x.order||0));
  t.steps.forEach((s,i)=>{ Store.saveTask({id:uid(),groupId:t.groupId,parentId:t.id,title:s.title||'',owner:teamName(s.owner)||'',ownerEmail:s.owner||'',progress:s.done?100:0,start:t.start,end:t.end,notes:'',steps:[],files:[],order:base+i+1,createdAt:Date.now(),createdBy:myEmail(),createdByName:(Auth.profile&&Auth.profile.name)||''}); });
  Store.saveTask({...t,steps:[]}); }
function puckStep(t){ return subsOf(t).find(k=>!subDone(k))||null; }
function puckOwner(t){ const k=puckStep(t); return k?subOwnerEmail(k):''; }
function puckBar(t){ const kids=subsOf(t); if(!kids.length) return ''; const k=puckStep(t);
  if(!k) return `<div class="puckbar done">✓ Все подзадачи выполнены</div>`;
  const idx=kids.indexOf(k)+1; const o=subOwnerEmail(k); const who=o?`<b>${esc(teamName(o))}</b>${isOnline(o)?' <i class="on"></i>':''}`:'<b class="hint">ответственный не назначен</b>';
  return `<div class="puckbar ${o===myEmail()?'me':''}">🏒 Сейчас ход: ${who} — подзадача ${idx}/${kids.length} «${esc(k.title||'')}»${o===myEmail()?' · <b>от вас требуется действие</b>':''}</div>`; }
function subtasksHtml(t){ const kids=subsOf(t); const done=kids.filter(subDone).length; const cur=puckStep(t); const avg=kids.length?Math.round(kids.reduce((s,k)=>s+(k.progress||0),0)/kids.length):0;
  return `<div class="f"><label>Подзадачи ${kids.length?`· ${done}/${kids.length}`:''}<span class="hint" style="margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0">🏒 — у кого сейчас ход</span></label>
    <div class="subs" id="d_subs">${kids.map(k=>{ const o=subOwnerEmail(k); return `<div class="subrow ${subDone(k)?'done':''} ${k===cur?'cur':''}" data-k="${k.id}">
      <input type="checkbox" class="sdone" ${subDone(k)?'checked':''} title="Выполнено"><span class="pk">${k===cur?'🏒':''}</span>
      <input type="text" class="stitle" value="${esc(k.title||'')}" placeholder="Название подзадачи">
      <div class="meta"><label>Кто <select class="sown" title="Ответственный за подзадачу"><option value="">— не назначен</option>${state.team.filter(u=>u.email&&u.role!=='pending'&&u.role!=='blocked').map(u=>`<option value="${esc(u.email)}"${o===u.email?' selected':''}>${esc(u.name||u.email)}</option>`).join('')}${o&&!teamByEmail(o)?`<option value="${esc(o)}" selected>${esc(o)}</option>`:''}</select></label>
      <label>Срок <input type="date" class="sdate" value="${k.end||''}" title="Срок подзадачи"></label>
      <span class="spr"><input type="range" min="0" max="100" step="5" value="${k.progress||0}" title="Прогресс"><b>${k.progress||0}%</b></span></div>
      <button type="button" class="open" data-open="${k.id}" title="Открыть карточку подзадачи: файлы, обсуждение, свои подзадачи">↗</button>${state.ro?'':'<button type="button" class="x" title="Удалить подзадачу">✕</button>'}
    </div>`; }).join('')||'<div class="hint">Подзадач пока нет. Подзадача — это шаг процесса со своим ответственным, сроком и прогрессом; ход (🏒) переходит к ответственному первой невыполненной подзадачи.</div>'}</div>
    ${state.ro?'':`<div class="addstep"><input id="d_newsub" placeholder="＋ Добавить подзадачу и нажать Enter"></div>${kids.length?`<div><button type="button" class="btn sm" id="d_calc2">Пересчитать % задачи по подзадачам (${avg}%)</button></div>`:''}`}
  </div>`; }
function bindSubtasks(dr,t,save){
  const upd=(id,patch)=>{ const k=state.tasks.find(x=>x.id===id); if(k) Store.saveTask({...k,...patch}); };
  const after=(before)=>{ puckMoved(t.id,before); render(); refreshDrawer(); };
  const ns=dr.querySelector('#d_newsub'); if(ns) ns.onkeydown=e=>{ if(e.key==='Enter'&&ns.value.trim()){ e.preventDefault(); const cur=state.tasks.find(x=>x.id===t.id)||t; const before=puckOwner(cur); const order=Math.max(0,...childrenOf(t.id).map(x=>x.order||0))+1;
      Store.saveTask({id:uid(),groupId:cur.groupId,parentId:t.id,title:ns.value.trim(),owner:'',ownerEmail:'',progress:0,start:cur.start||todayStr(),end:cur.end||null,notes:'',steps:[],files:[],order,priority:'normal',createdAt:Date.now(),createdBy:myEmail(),createdByName:(Auth.profile&&Auth.profile.name)||''});
      puckMoved(t.id,before); render(); renderDrawer(true); const n2=dr.querySelector('#d_newsub'); if(n2) n2.focus(); } };
  dr.querySelectorAll('.subrow').forEach(row=>{ const id=row.dataset.k; const cur=()=>state.tasks.find(x=>x.id===t.id)||t;
    const cb=row.querySelector('.sdone'); cb.onchange=()=>{ const before=puckOwner(cur()); upd(id,{progress:cb.checked?100:0,doneAt:cb.checked?Date.now():null,doneBy:cb.checked?myEmail():null}); after(before); };
    const ti=row.querySelector('.stitle'); ti.onchange=()=>upd(id,{title:ti.value.trim()}); ti.onkeydown=e=>{ if(e.key==='Enter') ti.blur(); };
    const so=row.querySelector('.sown'); so.onmousedown=e=>e.stopPropagation(); so.onchange=async()=>{ const before=puckOwner(cur()); const k=state.tasks.find(x=>x.id===id); const em=(so.value||'').toLowerCase(); const prev=subOwnerEmail(k); upd(id,{ownerEmail:em,owner:em?teamName(em):'',assignedAt:Date.now()}); if(em&&em!==prev&&em!==myEmail()){ const k2=state.tasks.find(x=>x.id===id); Mail.notifyPeople(k2,[em]); } after(before); };
    const sd=row.querySelector('.sdate'); sd.onchange=()=>{ upd(id,{end:sd.value||null}); render(); };
    const rg=row.querySelector('.spr input'); const lb=row.querySelector('.spr b'); rg.oninput=()=>{ lb.textContent=rg.value+'%'; }; rg.onchange=()=>{ const before=puckOwner(cur()); upd(id,{progress:+rg.value}); after(before); };
    const op=row.querySelector('.open'); op.onmousedown=e=>e.preventDefault(); op.onclick=()=>{ flushDrawer(); openTask(id); };
    const x=row.querySelector('.x'); if(x) x.onclick=()=>{ const k=state.tasks.find(x2=>x2.id===id); confirmModal(`Удалить подзадачу «${k?.title||'без названия'}»?`,()=>{ const before=puckOwner(cur()); Store.deleteTask(id); after(before); }); }; });
  const calc=dr.querySelector('#d_calc2'); if(calc){ calc.onmousedown=e=>e.preventDefault(); calc.onclick=()=>{ const kids=subsOf(cur0()); if(!kids.length) return; save({progress:Math.round(kids.reduce((s,k)=>s+(k.progress||0),0)/kids.length)}); render(); refreshDrawer(); }; }
  function cur0(){ return state.tasks.find(x=>x.id===t.id)||t; } }
/* связи: только основание (подчинённые — в блоке «Подзадачи») */
function linksHtml(t){ const desc=descendants(t.id); const opts=sortedGroups().map(g=>{ const ts=tasksOf(g.id).filter(x=>x.id!==t.id&&!desc.has(x.id)&&!x.parentId); return ts.length?`<optgroup label="${esc(g.name)}">${ts.map(x=>`<option value="${x.id}"${t.parentId===x.id?' selected':''}>${esc(x.title||'без названия')}</option>`).join('')}</optgroup>`:''; }).join('');
  const chain=chainOf(t);
  return `<div class="f"><label>Основание · родительская задача</label>
    ${chain.length?`<div class="chain">${chain.map(p=>`<button type="button" class="lnk" data-open="${p.id}">${esc(p.title||'без названия')}</button> ›`).join(' ')} <b>${esc(t.title||'эта задача')}</b></div>`:''}
    <select id="d_parent" ${state.ro?'disabled':''}><option value="">— нет (самостоятельная задача)</option>${opts}</select>
    <div class="hint">Если выбрать основание, эта задача станет подзадачей выбранной и будет видна в её карточке.</div>
  </div>`; }

function autosize(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
/* =========================================================
   v8 — раздел «Сток»: остатки на складе фулфилмента СДТ (через Edge Function sdt)
   ========================================================= */
state.stock=null; state.stockQ=''; state.stockOnly=''; state.stockSort='name'; state.stockDir=1; state.stockBusy=false;
const fmtN=n=>Number(n||0).toLocaleString('ru-RU');
Store.loadStock=async function(){ if(this.mode!=='db') return; const {data,error}=await sb.from('settings').select('value').eq('key','sdt_stock').maybeSingle(); if(error) throw new Error(error.message); if(data&&data.value) state.stock=data.value; };
Store.refreshStock=async function(){ if(this.mode!=='db'||!sb){ toast('Остатки доступны только на сайте (нужен вход)'); return; } if(state.stockBusy) return; state.stockBusy=true; if(state.view==='stock') render();
  try{ const {data,error}=await sb.functions.invoke('sdt',{body:{action:'stock'}});
    if(error){ let msg=error.message||String(error); try{ const ctx=error.context; if(ctx&&ctx.json){ const j=await ctx.json(); if(j&&j.error) msg=j.error; } }catch(e){} throw new Error(msg); }
    if(data&&data.error) throw new Error(data.error);
    state.stock={at:data.at,by:data.by,base:data.base,count:data.count,items:data.items||[]}; toast('Остатки обновлены: '+fmtN(data.count)+' позиций'); }
  catch(e){ toast('Не удалось получить остатки: '+(e?.message||e)); }
  state.stockBusy=false; if(state.view==='stock') render(); };
function stockRows(){ const it=(state.stock&&state.stock.items)||[]; const q=state.stockQ.trim().toLowerCase(); const only=state.stockOnly;
  let r=it.filter(x=>!q||(x.item_id+' '+x.name+' '+(x.barcode||[]).join(' ')).toLowerCase().includes(q));
  if(only==='zero') r=r.filter(x=>(x.cnt||0)<=0); else if(only==='low') r=r.filter(x=>(x.cnt||0)>0&&(x.cnt||0)<=5); else if(only==='problem') r=r.filter(x=>(x.stock_q||0)+(x.stock_d||0)+(x.stock_e||0)>0); else if(only==='reserved') r=r.filter(x=>(x.reserved||0)>0);
  const k=state.stockSort, d=state.stockDir; r.sort((a,b)=>{ const va=a[k], vb=b[k]; if(typeof va==='number'||typeof vb==='number') return ((va||0)-(vb||0))*d; return String(va||'').localeCompare(String(vb||''),'ru')*d; }); return r; }
function renderStock(main){ const s=state.stock; const items=(s&&s.items)||[]; const rows=stockRows();
  const tot=items.reduce((a,x)=>({cnt:a.cnt+(x.cnt||0),res:a.res+(x.reserved||0),a:a.a+(x.stock_a||0),bad:a.bad+(x.stock_q||0)+(x.stock_d||0)+(x.stock_e||0)}),{cnt:0,res:0,a:0,bad:0});
  const zero=items.filter(x=>(x.cnt||0)<=0).length, low=items.filter(x=>(x.cnt||0)>0&&(x.cnt||0)<=5).length;
  const th=(k,l,num)=>`<th data-s="${k}" style="cursor:pointer;${num?'text-align:right':''}" title="Сортировать">${l}${state.stockSort===k?(state.stockDir>0?' ▲':' ▼'):''}</th>`;
  main.innerHTML=`<div class="gtoolbar" style="justify-content:space-between">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="search" id="st_q" placeholder="Артикул, название, штрихкод…" value="${esc(state.stockQ)}" style="height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 10px;width:260px;max-width:100%">
      <select id="st_only" style="height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 10px"><option value="">Все позиции</option><option value="zero"${state.stockOnly==='zero'?' selected':''}>Нет в наличии</option><option value="low"${state.stockOnly==='low'?' selected':''}>Мало (≤5)</option><option value="reserved"${state.stockOnly==='reserved'?' selected':''}>Есть резерв</option><option value="problem"${state.stockOnly==='problem'?' selected':''}>Карантин / брак / просрочка</option></select></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="hint">${s?`Обновлено ${new Date(s.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${s.by?' · '+esc(s.by):''}`:'Данные ещё не загружались'}</span>
      ${Store.mode==='db'?`<button class="btn primary" id="st_refresh" ${state.stockBusy?'disabled':''}>${state.stockBusy?'Загружаю…':'⟳ Обновить из СДТ'}</button>`:''}<button class="btn" id="st_xlsx" ${items.length?'':'disabled'}>⬇ Excel</button></div></div>
  <div class="kpis"><div class="kpi"><div class="l">Позиций</div><div class="v">${fmtN(items.length)}</div><div class="h">в каталоге СДТ</div></div>
    <div class="kpi good"><div class="l">Свободный остаток</div><div class="v">${fmtN(tot.cnt)}</div><div class="h">шт · доступно к продаже</div></div>
    <div class="kpi"><div class="l">В резерве</div><div class="v">${fmtN(tot.res)}</div><div class="h">шт под заказы</div></div>
    <div class="kpi ${zero?'crit':''}"><div class="l">Нет в наличии</div><div class="v">${fmtN(zero)}</div><div class="h">${low?low+' позиций ≤5 шт':'позиций'}</div></div>
    <div class="kpi ${tot.bad?'crit':''}"><div class="l">Проблемный сток</div><div class="v">${fmtN(tot.bad)}</div><div class="h">карантин, брак, просрочка</div></div></div>
  <div class="tbl-wrap"><table class="tbl stock"><thead><tr>${th('item_id','Артикул')}${th('name','Название')}${th('cnt','Свободно',1)}${th('reserved','Резерв',1)}${th('stock_a','Годный (A)',1)}${th('cnt_b','B2B',1)}${th('stock_q','Карантин',1)}${th('stock_d','Брак',1)}${th('stock_e','Просроч.',1)}<th>Штрихкод</th>${th('updated','Обновлено')}</tr></thead>
