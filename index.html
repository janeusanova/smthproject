function wocPill(x){ const w=wocOf(x); const c=wocClass(w); const r=wocRate(x); const h=x.sold||{};
  const tip=h.err?'История СДТ недоступна: '+h.err:(h.first?`Продажи: ${h.w4||0} шт за 4 нед · ${h.w8||0} за 8 нед · ${h.w12||0} за 12 нед${h.ret?' · возвраты '+h.ret:''} · скорость ${r.toFixed(2)} шт/нед`:'Отгрузок по заказам ещё не было');
  const txt=w==null?(h.err?'?':'нет продаж'):(w>520?'>10 лет':w>=100?Math.round(w)+' нед':w.toFixed(1)+' нед');
  return `<span class="woc ${c}" title="${esc(tip)}">${txt}</span>`; }
Store._wocKpis=function(items){ const withW=items.map(x=>({x,w:wocOf(x)})); const low=withW.filter(o=>o.w!=null&&o.w<WOC_TARGET).length, mid=withW.filter(o=>o.w!=null&&o.w>=WOC_TARGET&&o.w<WOC_GOOD).length, ok=withW.filter(o=>o.w!=null&&o.w>=WOC_GOOD).length, none=withW.filter(o=>o.w==null).length; return {low,mid,ok,none}; };
/* расширяем фильтр и сортировку */
const _stockRows0=stockRows;
stockRows=function(){ const it=(state.stock&&state.stock.items)||[]; const q=state.stockQ.trim().toLowerCase(); const only=state.stockOnly;
  let r=it.filter(x=>!q||(x.item_id+' '+x.name+' '+(x.barcode||[]).join(' ')).toLowerCase().includes(q));
  if(only==='zero') r=r.filter(x=>(x.cnt||0)<=0); else if(only==='low') r=r.filter(x=>(x.cnt||0)>0&&(x.cnt||0)<=5); else if(only==='problem') r=r.filter(x=>(x.stock_q||0)+(x.stock_d||0)+(x.stock_e||0)>0); else if(only==='reserved') r=r.filter(x=>(x.reserved||0)>0);
  else if(only==='woc_low') r=r.filter(x=>{ const w=wocOf(x); return w!=null&&w<WOC_TARGET; }); else if(only==='woc_mid') r=r.filter(x=>{ const w=wocOf(x); return w!=null&&w>=WOC_TARGET&&w<WOC_GOOD; }); else if(only==='woc_ok') r=r.filter(x=>{ const w=wocOf(x); return w!=null&&w>=WOC_GOOD; }); else if(only==='woc_none') r=r.filter(x=>wocOf(x)==null);
  const k=state.stockSort, d=state.stockDir;
  const val=x=>k==='woc'?(wocOf(x)??(d>0?Infinity:-Infinity)):k==='rate'?wocRate(x):k==='w4'?((x.sold||{}).w4||0):x[k];
  r.sort((a,b)=>{ const va=val(a), vb=val(b); if(typeof va==='number'||typeof vb==='number') return ((va||0)-(vb||0))*d; return String(va||'').localeCompare(String(vb||''),'ru')*d; }); return r; };
/* новая отрисовка стока: те же KPI + WOC */
renderStock=function(main){ const s=state.stock; const items=(s&&s.items)||[]; const rows=stockRows();
  const tot=items.reduce((a,x)=>({cnt:a.cnt+(x.cnt||0),res:a.res+(x.reserved||0),bad:a.bad+(x.stock_q||0)+(x.stock_d||0)+(x.stock_e||0)}),{cnt:0,res:0,bad:0});
  const zero=items.filter(x=>(x.cnt||0)<=0).length; const low5=items.filter(x=>(x.cnt||0)>0&&(x.cnt||0)<=5).length; const K=Store._wocKpis(items);
  const th=(k,l,num)=>`<th data-s="${k}" style="cursor:pointer;${num?'text-align:right':''}" title="Сортировать">${l}${state.stockSort===k?(state.stockDir>0?' ▲':' ▼'):''}</th>`;
  const opt=(v,l)=>`<option value="${v}"${state.stockOnly===v?' selected':''}>${l}</option>`;
  main.innerHTML=`<div class="gtoolbar" style="justify-content:space-between">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="search" id="st_q" placeholder="Артикул, название, штрихкод…" value="${esc(state.stockQ)}" style="height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 10px;width:260px;max-width:100%">
      <select id="st_only" style="height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 10px"><option value="">Все позиции</option><optgroup label="Запас (WOC)">${opt('woc_low','Дефицит · меньше 8 недель')}${opt('woc_mid','Внимание · 8–12 недель')}${opt('woc_ok','Норма · 12 недель и больше')}${opt('woc_none','Нет продаж')}${opt('woc_drop','Единоразовый дроп')}</optgroup><optgroup label="Остаток">${opt('zero','Нет в наличии')}${opt('low','Мало (≤5 шт)')}${opt('reserved','Есть резерв')}${opt('problem','Карантин / брак / просрочка')}</optgroup></select></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="hint">${s?`Обновлено ${new Date(s.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${s.by?' · '+esc(s.by):''}`:'Данные ещё не загружались'}</span>
      ${Store.mode==='db'?`<button class="btn primary" id="st_refresh" ${state.stockBusy?'disabled':''}>${state.stockBusy?'Загружаю…':'⟳ Обновить из СДТ'}</button>`:''}<button class="btn" id="st_xlsx" ${items.length?'':'disabled'}>⬇ Excel</button></div></div>
  <div class="kpis"><div class="kpi"><div class="l">Позиций</div><div class="v">${fmtN(items.length)}</div><div class="h">в каталоге СДТ${K.drop?' · '+K.drop+' дроп':''}</div></div>
    <div class="kpi good"><div class="l">Свободный остаток</div><div class="v">${fmtN(tot.cnt)}</div><div class="h">шт · доступно к продаже</div></div>
    <div class="kpi click" data-only="reserved"><div class="l">В резерве</div><div class="v">${fmtN(tot.res)}</div><div class="h">шт под заказы</div></div>
    <div class="kpi ${zero?'crit':''} click" data-only="zero"><div class="l">Нет в наличии</div><div class="v">${fmtN(zero)}</div><div class="h">${low5?low5+' позиций ≤5 шт':'позиций'}</div></div>
    <div class="kpi ${tot.bad?'crit':''} click" data-only="problem"><div class="l">Проблемный сток</div><div class="v">${fmtN(tot.bad)}</div><div class="h">шт · карантин, брак, просрочка</div></div></div>
  <div class="kpis woc3"><div class="kpi tl low click" data-only="woc_low"><div class="l">Дефицит · WOC &lt; 8 недель</div><div class="v">${fmtN(K.low)}</div><div class="h">позиций · запаса меньше 8 недель</div></div>
    <div class="kpi tl mid click" data-only="woc_mid"><div class="l">Внимание · WOC 8–12</div><div class="v">${fmtN(K.mid)}</div><div class="h">позиций · пора планировать пополнение</div></div>
    <div class="kpi tl ok click" data-only="woc_ok"><div class="l">Норма · WOC ≥ 12</div><div class="v">${fmtN(K.ok)}</div><div class="h">позиций · запас достаточный${K.none?' · '+K.none+' без продаж':''}</div></div></div>
  <div class="tbl-wrap"><table class="tbl stock"><thead><tr>${th('item_id','Артикул')}${th('name','Название')}${th('cnt','Свободно',1)}${th('reserved','Резерв',1)}${th('w4','Прод. 4 нед',1)}${th('rate','Шт/нед',1)}${th('woc','WOC · недель запаса')}<th title="Единоразовый дроп: допроизводства не будет, WOC не считается">Дроп</th>${th('stock_a','Годный (A)',1)}${th('cnt_b','B2B',1)}${th('stock_q','Карантин',1)}${th('stock_d','Брак',1)}${th('stock_e','Просроч.',1)}<th>Штрихкод</th>${th('updated','Обновлено')}</tr></thead>
  <tbody>${rows.map(x=>{ const r=wocRate(x); return `<tr class="${(x.cnt||0)<=0?'zero':''} ${isDrop(x)?'isdrop':''}"><td class="mono">${esc(x.item_id)}</td><td>${esc(x.name)}</td><td class="num"><b>${fmtN(x.cnt)}</b></td><td class="num">${x.reserved?fmtN(x.reserved):'—'}</td><td class="num">${x.sold&&!x.sold.err?fmtN(x.sold.w4||0):'—'}</td><td class="num">${r?r.toFixed(1):'—'}</td><td class="woccell">${wocPill(x)}</td><td class="drop">${Store.canWrite&&!state.ro?`<input type="checkbox" class="dropchk" data-i="${esc(x.item_id)}" ${isDrop(x)?'checked':''} title="Единоразовый дроп — допроизводства не будет">`:(isDrop(x)?'✓':'')}</td><td class="num">${fmtN(x.stock_a)}</td><td class="num">${x.cnt_b?fmtN(x.cnt_b):'—'}</td><td class="num ${x.stock_q?'warn':''}">${x.stock_q||'—'}</td><td class="num ${x.stock_d?'warn':''}">${x.stock_d||'—'}</td><td class="num ${x.stock_e?'warn':''}">${x.stock_e||'—'}</td><td class="mono hint">${esc((x.barcode||[]).slice(0,2).join(', '))}${(x.barcode||[]).length>2?' …':''}</td><td class="hint" style="white-space:nowrap">${x.updated?esc(String(x.updated).replace('T',' ').slice(0,16)):'—'}</td></tr>`; }).join('')||`<tr><td colspan="15" class="empty" style="padding:18px">${items.length?'По фильтру ничего не найдено':(s?'Каталог пуст':'Нажмите «Обновить из СДТ». Для работы нужны ключи партнёра СДТ в секретах функции sdt (SDT_CLIENT_ID, SDT_CLIENT_SECRET).')}</td></tr>`}</tbody>
  ${rows.length?`<tfoot><tr><td colspan="2"><b>Итого по выборке · ${fmtN(rows.length)} поз.</b></td><td class="num"><b>${fmtN(rows.reduce((a,x)=>a+(x.cnt||0),0))}</b></td><td class="num">${fmtN(rows.reduce((a,x)=>a+(x.reserved||0),0))}</td><td class="num">${fmtN(rows.reduce((a,x)=>a+((x.sold||{}).w4||0),0))}</td><td class="num">${rows.reduce((a,x)=>a+wocRate(x),0).toFixed(1)}</td><td></td><td></td><td class="num">${fmtN(rows.reduce((a,x)=>a+(x.stock_a||0),0))}</td><td class="num">${fmtN(rows.reduce((a,x)=>a+(x.cnt_b||0),0))}</td><td class="num">${fmtN(rows.reduce((a,x)=>a+(x.stock_q||0),0))}</td><td class="num">${fmtN(rows.reduce((a,x)=>a+(x.stock_d||0),0))}</td><td class="num">${fmtN(rows.reduce((a,x)=>a+(x.stock_e||0),0))}</td><td colspan="2"></td></tr></tfoot>`:''}</table></div>
  <div class="hint" style="margin-top:8px"><b>WOC</b> (weeks of coverage) = свободный остаток ÷ средние продажи в неделю. Продажи — отгрузки по заказам из истории движения товара в СДТ за последние 8 недель (минус возвраты); если товар на складе меньше 8 недель — за фактический срок. Норма запаса — 8 недель: <span class="woc low">меньше 8</span> · <span class="woc mid">8–12</span> · <span class="woc ok">12 и больше</span>. Наведите на значение — покажет продажи за 4/8/12 недель. Галочка <b>Дроп</b> — единоразовый выпуск без допроизводства: WOC для него не считается и в «Дефицит» он не попадает.</div>`;
  const q=$('#st_q'); q.oninput=()=>{ state.stockQ=q.value; renderStock(main); const q2=$('#st_q'); q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); };
  $('#st_only').onchange=e=>{ state.stockOnly=e.target.value; renderStock(main); };
  main.querySelectorAll('.kpi.click').forEach(k=>k.onclick=()=>{ state.stockOnly=state.stockOnly===k.dataset.only?'':k.dataset.only; renderStock(main); });
  const rb=$('#st_refresh'); if(rb) rb.onclick=()=>Store.refreshStock();
  $('#st_xlsx').onclick=()=>Exp.run('stock-xlsx');
  if(typeof bindDrops==='function') bindDrops(main);
  main.querySelectorAll('th[data-s]').forEach(h=>h.onclick=()=>{ const k=h.dataset.s; if(state.stockSort===k) state.stockDir=-state.stockDir; else { state.stockSort=k; state.stockDir=['name','item_id','updated','woc'].includes(k)?1:-1; } renderStock(main); }); };
Exp.stockXlsx=async function(){ const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet('Сток СДТ',{views:[{state:'frozen',ySplit:1}]});
  ws.columns=[{header:'Артикул',key:'i',width:22},{header:'Название',key:'n',width:48},{header:'Свободно',key:'c',width:12},{header:'Резерв',key:'r',width:10},{header:'Продажи 4 нед',key:'s4',width:14},{header:'Продажи 8 нед',key:'s8',width:14},{header:'Продажи 12 нед',key:'s12',width:14},{header:'Шт/нед',key:'rt',width:10},{header:'WOC, нед',key:'w',width:11},{header:'Статус запаса',key:'ws',width:16},{header:'Годный (A)',key:'a',width:12},{header:'B2B',key:'b',width:10},{header:'Карантин',key:'q',width:10},{header:'Брак',key:'d',width:8},{header:'Просрочено',key:'e',width:11},{header:'Штрихкоды',key:'bc',width:30},{header:'Обновлено',key:'u',width:18}];
  ws.getRow(1).font={bold:true}; ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF6F4EF'}};
  const lbl={low:'Дефицит (<8)',mid:'Внимание (8–12)',ok:'Норма (≥12)',none:'Нет продаж',drop:'Единоразовый дроп'}; const fill={low:'FFF8DEDE',mid:'FFFFF0D6',ok:'FFDFF4E8',none:'FFECEAE4',drop:'FFE8E6F5'};
  stockRows().forEach(x=>{ const h=x.sold||{}; const w=isDrop(x)?null:wocOf(x); const c=wocClass(w,x); const row=ws.addRow({i:x.item_id,n:x.name,c:x.cnt,r:x.reserved,s4:h.err?null:(h.w4||0),s8:h.err?null:(h.w8||0),s12:h.err?null:(h.w12||0),rt:wocRate(x)||null,w:w==null?null:Math.round(w*10)/10,ws:lbl[c],a:x.stock_a,b:x.cnt_b,q:x.stock_q,d:x.stock_d,e:x.stock_e,bc:(x.barcode||[]).join(', '),u:x.updated?String(x.updated).replace('T',' ').slice(0,16):''}); row.getCell('ws').fill={type:'pattern',pattern:'solid',fgColor:{argb:fill[c]}}; row.getCell('w').fill={type:'pattern',pattern:'solid',fgColor:{argb:fill[c]}}; });
  ws.getColumn('rt').numFmt='0.0'; ws.getColumn('w').numFmt='0.0';
  ws.autoFilter={from:'A1',to:'Q1'}; const buf=await wb.xlsx.writeBuffer(); await this.save(this.fname('сток_СДТ')+'.xlsx',buf); };

/* ---------- «Мои задачи»: только верхнеуровневые задачи; подзадача «поднимает» родителя ---------- */
const mySubs=t=>(typeof subsOf==='function'?subsOf(t):[]).filter(k=>isMine(k));
myTasks=()=>state.tasks.filter(t=>!(t.parentId&&state.tasks.some(p=>p.id===t.parentId))&&(isMine(t)||mySubs(t).length>0));
myNew=()=>myTasks().filter(t=>myState(t)==='new'||mySubs(t).some(k=>myState(k)==='new'));
function myTasksPanel(){ const mine=myTasks(); if(!mine.length) return `<div class="panel my"><h2>Мои задачи</h2><div class="hint">Пока нет задач, где вы ответственный или участник. Задача попадает сюда, когда в её карточке указан ваш email ответственного (или ваше имя, как в профиле), вы добавлены в участники, за вами подзадача или ход по ней.</div></div>`;
  const stOf=t=>{ if(isMine(t)) return myState(t); const ks=mySubs(t); if(ks.some(k=>myState(k)==='new')) return 'new'; if(ks.length&&ks.every(k=>myState(k)==='done')) return 'done'; return 'progress'; };
  const by={new:[],progress:[],done:[]}; mine.forEach(t=>by[stOf(t)].push(t));
  const srt=a=>a.sort((x,y)=>(x.end||'9999').localeCompare(y.end||'9999'));
  const col=(k,title,cls)=>`<div class="mycol"><div class="myh ${cls}">${title} <b>${by[k].length}</b></div><div class="dl">${srt(by[k]).map(t=>{ const g=groupOf(t.groupId); const late=t.end&&t.end<todayStr()&&k!=='done'; const ks=mySubs(t).filter(x=>(x.progress||0)<100); const puck=(typeof puckOwner==='function'&&puckOwner(t)===myEmail());
    return `<div class="dl-row" data-t="${t.id}"><span class="d" style="${late?'color:var(--crit)':''}">${t.end?fmt(t.end):'—'}</span><span class="t"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${gcolor(g)};margin-right:6px"></i>${esc(t.title||'без названия')}${k==='new'?'<span class="badge">new</span>':''}${puck?'<span class="badge" style="background:var(--ink)">🏒 ваш ход</span>':''}${ks.length?`<div class="hint" style="margin-top:2px">↳ ваша подзадача: ${esc(ks.map(x=>x.title||'без названия').join(' · '))}</div>`:''}</span><span class="o">${t.progress||0}%</span></div>`; }).join('')||'<div class="empty">—</div>'}</div></div>`;
  return `<div class="panel my"><h2>Мои задачи <span class="hint" style="font-weight:400">· ${mine.length} · ответственный, участник или подзадача за вами</span></h2><div class="mygrid">${col('new','Новые','n')}${col('progress','В работе','p')}${col('done','Завершены','d')}</div></div>`; }
/* экспорт Excel: подзадачи внутри строки родителя, а не отдельными строками */
const _tasksOfTop=gid=>tasksOf(gid).filter(t=>!(t.parentId&&state.tasks.some(p=>p.id===t.parentId)));
/* =========================================================
   v14 — «единоразовый дроп»: флаг товара, для которого WOC не считается (допроизводства не будет)
   ========================================================= */
state.stockFlags={};
const isDrop=x=>!!(state.stockFlags[x.item_id]&&state.stockFlags[x.item_id].drop);
Store.loadStockFlags=async function(){ if(this.mode!=='db') return; const {data,error}=await sb.from('settings').select('value').eq('key','sdt_flags').maybeSingle(); if(error) throw new Error(error.message); if(data&&data.value) state.stockFlags=data.value; };
Store.setDrop=async function(itemId,on){ const f={...state.stockFlags}; if(on) f[itemId]={...(f[itemId]||{}),drop:true,by:myEmail(),at:new Date().toISOString()}; else { if(f[itemId]) delete f[itemId].drop; if(f[itemId]&&!Object.keys(f[itemId]).some(k=>!['by','at'].includes(k))) delete f[itemId]; }
  state.stockFlags=f; if(this.mode==='db'){ const {error}=await sb.from('settings').upsert({key:'sdt_flags',value:f}); if(error) toast('Не удалось сохранить: '+error.message); } };
const _loadStock14=Store.loadStock; Store.loadStock=async function(){ await Promise.all([_loadStock14.call(this),this.loadStockFlags()]); };
function wocClass(w,x){ if(x&&isDrop(x)) return 'drop'; if(w==null) return 'none'; if(w<WOC_TARGET) return 'low'; if(w<WOC_GOOD) return 'mid'; return 'ok'; }
function wocPill(x){ if(isDrop(x)) return `<span class="woc drop" title="Единоразовый дроп: допроизводства не будет, запас не нормируется">дроп</span>`;
  const w=wocOf(x); const c=wocClass(w); const r=wocRate(x); const h=x.sold||{};
  const tip=h.err?'История СДТ недоступна: '+h.err:(h.first?`Продажи: ${h.w4||0} шт за 4 нед · ${h.w8||0} за 8 нед · ${h.w12||0} за 12 нед${h.ret?' · возвраты '+h.ret:''} · скорость ${r.toFixed(2)} шт/нед`:'Отгрузок по заказам ещё не было');
  const txt=w==null?(h.err?'?':'нет продаж'):(w>520?'>10 лет':w>=100?Math.round(w)+' нед':w.toFixed(1)+' нед');
  return `<span class="woc ${c}" title="${esc(tip)}">${txt}</span>`; }
Store._wocKpis=function(items){ const live=items.filter(x=>!isDrop(x)); const withW=live.map(x=>({x,w:wocOf(x)})); return {low:withW.filter(o=>o.w!=null&&o.w<WOC_TARGET).length, mid:withW.filter(o=>o.w!=null&&o.w>=WOC_TARGET&&o.w<WOC_GOOD).length, ok:withW.filter(o=>o.w!=null&&o.w>=WOC_GOOD).length, none:withW.filter(o=>o.w==null).length, drop:items.length-live.length}; };
const _stockRows13=stockRows;
stockRows=function(){ const only=state.stockOnly; if(only==='woc_drop'){ const it=(state.stock&&state.stock.items)||[]; const q=state.stockQ.trim().toLowerCase(); return it.filter(x=>isDrop(x)&&(!q||(x.item_id+' '+x.name+' '+(x.barcode||[]).join(' ')).toLowerCase().includes(q))); }
  let r=_stockRows13(); if(['woc_low','woc_mid','woc_ok','woc_none'].includes(only)) r=r.filter(x=>!isDrop(x)); return r; };
function bindDrops(main){ main.querySelectorAll('input.dropchk').forEach(c=>c.onchange=async()=>{ await Store.setDrop(c.dataset.i,c.checked); renderStock(main); }); }

/* ---------- v10: ленивая загрузка тяжёлых библиотек ---------- */
const _libs={};
function loadLib(src){ if(_libs[src]) return _libs[src]; _libs[src]=new Promise((res,rej)=>{ const el=document.createElement('script'); el.src=src+'?v=10'; el.onload=()=>res(); el.onerror=()=>{ delete _libs[src]; rej(new Error(src)); }; document.head.appendChild(el); }); return _libs[src]; }
function loadLibs(list){ return Promise.all(list.map(loadLib)); }

Store.init();
</script>
